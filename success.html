<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order status — Luca's Photography</title><link rel="stylesheet" href="/styles.css"></head><body><div class="announcement">LUCA'S PHOTOGRAPHY · ORDER STATUS</div><main class="success-page"><p class="eyebrow">THANK YOU</p><h1 id="title">Checking your <i>order.</i></h1><p id="msg">Stripe is confirming payment. The download email is sent after the server receives a verified payment event.</p><a class="button button-dark" href="/">Return to the collection</a><p class="success-note">Check your inbox and spam folder for your secure ZIP link.</p></main><script>(async()=>{let id=new URLSearchParams(location.search).get('session_id');if(!id)return;try{let r=await fetch('/api/session-status?session_id='+encodeURIComponent(id)),d=await r.json();if(d.paymentStatus==='paid'){document.getElementById('title').innerHTML='Payment <i>confirmed.</i>';document.getElementById('msg').textContent='Thank you! The server is preparing your ZIP and sending the download email. Please check your inbox shortly.'}}catch{}})()</script></body></html>
